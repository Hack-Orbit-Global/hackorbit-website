<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Core glowing gradient matching the tech noir blue theme -->
    <linearGradient id="orbit-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6c8ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4080ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1a3a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer dashed calibration/orbit ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#orbit-glow)" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Inner solid orbit tracking ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#a6c8ff" stroke-width="1.25" stroke-dasharray="40 10 20 5 15 15" opacity="0.7" />

  <!-- Core Singular Node (The Orbit Core) -->
  <circle cx="50" cy="50" r="8" fill="#a6c8ff" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#070A0F" />

  <!-- Satellite node orbiting the core -->
  <circle cx="86" cy="50" r="3.5" fill="#a6c8ff" filter="url(#glow)" />
  
  <!-- Stylized Hack Bracket overlay -->
  <path d="M 32 38 L 22 50 L 32 62" fill="none" stroke="#a6c8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 38 L 78 50 L 68 62" fill="none" stroke="#a6c8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Telemetry ticks -->
  <line x1="50" y1="2" x2="50" y2="8" stroke="#a6c8ff" stroke-width="1" opacity="0.6" />
  <line x1="50" y1="92" x2="50" y2="98" stroke="#a6c8ff" stroke-width="1" opacity="0.6" />
  <line x1="2" y1="50" x2="8" y2="50" stroke="#a6c8ff" stroke-width="1" opacity="0.6" />
  <line x1="92" y1="50" x2="98" y2="50" stroke="#a6c8ff" stroke-width="1" opacity="0.6" />
</svg>

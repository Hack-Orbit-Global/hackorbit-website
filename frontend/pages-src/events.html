<!doctype html>
<html lang="en">
  <head>
    <!-- {{HEAD}} -->
    <title>Hack Orbit — Participate</title>
    <meta
      name="description"
      content="Hack Orbit events, workshops, and meetups. There are no upcoming events right now — join the community on GitHub and Discord to be the first to know."
    />
    <link rel="canonical" href="{{SITE_URL}}/events" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hack Orbit — Participate" />

    <meta property="og:url" content="{{SITE_URL}}/events" />

    <!-- {{NAV}} -->

          <h1 id="events-title">Hack Orbit events</h1>

        </div>

<!doctype html>
<html lang="en">
  <head>
    <!-- {{HEAD}} -->
    <title>Hack Orbit — Member Profiles</title>
    <meta name="description" content="Hack Orbit no longer runs member profiles or account settings. Find a project and start contributing." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="{{SITE_URL}}/settings" />
  </head>
  <body>
    <!-- {{NAV}} -->
    <main id="main">
      <section class="section orbital reveal" aria-labelledby="settings-title">
        <div class="container" style="max-width: 680px">
          <span class="eyebrow">Hack Orbit</span>
          <h1 id="settings-title">Member profiles are retired</h1>
          <p class="lead" style="margin-top: 12px">
            Hack Orbit no longer runs member profiles or account settings. The community is open
            to everyone — find a project and start contributing on GitHub.
          </p>
          <div class="form-actions" style="margin-top: 28px">
            <a class="btn btn--primary" href="/contribute">Start contributing</a>
            <a class="btn btn--ghost" href="/">Back to home</a>
          </div>
        </div>
      </section>
    </main>
    <!-- {{FOOTER}} -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>

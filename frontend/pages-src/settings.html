<!doctype html>

    <link rel="canonical" href="{{SITE_URL}}/settings" />
  </head>
  <body>
    <!-- {{NAV}} -->
    <main id="main">

            <p>Want to help shape what Hack Orbit becomes? Start contributing today.</p>
          </div>
          <div class="form-actions" style="margin-top: 28px">
            <a class="btn btn--primary" href="/contribute">Contribute to Hack Orbit</a>
          </div>
        </div>

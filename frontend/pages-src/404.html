<!doctype html>
<html lang="en">
  <head>
    <!-- {{HEAD}} -->
    <title>Page Not Found — Hack Orbit</title>
    <meta name="description" content="The page you were looking for could not be found." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="{{SITE_URL}}/404" />
  </head>
  <body>
    <!-- {{NAV}} -->
    <main id="main">
      <section class="section orbital" aria-labelledby="not-found-title">
        <div class="container" style="max-width: 640px; text-align: center">
          <span class="eyebrow">Error 404</span>
          <h1 id="not-found-title">This page drifted out of orbit.</h1>
          <p class="lead" style="margin: 16px auto 32px; max-width: 44ch">
            The page you were looking for doesn't exist or has moved.
          </p>
          <div class="hero__actions" style="justify-content: center">
            <a class="btn btn--primary btn--lg" href="/">Back to home</a>
          </div>
        </div>
      </section>
    </main>
    <!-- {{FOOTER}} -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <!-- {{HEAD}} -->
    <title>Something Went Wrong — Hack Orbit</title>
    <meta name="description" content="An unexpected error occurred. Please try again shortly." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="{{SITE_URL}}/500" />
  </head>
  <body>
    <!-- {{NAV}} -->
    <main id="main">
      <section class="section orbital reveal" aria-labelledby="error-title">
        <div class="container" style="max-width: 640px; text-align: center">
          <span class="eyebrow">Error 500</span>
          <h1 id="error-title">Something went wrong.</h1>
          <p class="lead" style="margin: 16px auto 32px; max-width: 44ch">
            An unexpected error occurred. Please try again in a moment — if it persists,
            <a class="link-arrow" href="/contact" style="display: inline-flex">contact us →</a>
          </p>
          <div class="hero__actions" style="justify-content: center">
            <a class="btn btn--primary btn--lg btn-arrow" href="/">Back to home
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          </div>
        </div>
      </section>
    </main>
    <!-- {{FOOTER}} -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>

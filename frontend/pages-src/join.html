<!doctype html>
<html lang="en">
  <head>
    <!-- {{HEAD}} -->
    <title>Join Hack Orbit</title>
    <meta
      name="description"
      content="Join Hack Orbit, an open-source technology organisation and developer community for builders. Get involved on GitHub and Discord."
    />
    <link rel="canonical" href="{{SITE_URL}}/join" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Join Hack Orbit" />
    <meta property="og:description" content="Join Hack Orbit, an open-source technology organisation and developer community." />
    <meta property="og:url" content="{{SITE_URL}}/join" />
    <meta property="og:image" content="{{SITE_URL}}/assets/banner/banner.avif" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Join Hack Orbit" />
  </head>
  <body>
    <!-- {{NAV}} -->
    <main id="main">
      <section class="section orbital" aria-labelledby="join-title">
        <div class="container" style="max-width: 680px">
          <span class="eyebrow">Join the community</span>
          <h1 id="join-title">Join Hack Orbit</h1>
          <p class="lead" style="margin-top: 16px">
            Hack Orbit is a home for builders. Join our community on GitHub and Discord, explore
            the projects, and start contributing.
          </p>
          <div class="callout callout--info" style="margin-top: 32px">
            <p>
              No sign-up flow needed — everything is open source and ready for contributors.
            </p>
          </div>
          <div class="form-actions" style="margin-top: 28px">
            <a class="btn btn--primary" href="/contribute">Contribute to Hack Orbit</a>
            <a class="btn btn--ghost" href="/contact">Contact us</a>
          </div>
        </div>
      </section>
    </main>
    <!-- {{FOOTER}} -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
